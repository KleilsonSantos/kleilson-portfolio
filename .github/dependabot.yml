# pnpm workspaces: um único lockfile na raiz.
# Mirar subpastas gera PRs sem pnpm-lock.yaml coerente → CI frozen-lockfile falha.
# Ref: https://github.com/dependabot/dependabot-core/issues/10758
# Version updates seguem o fluxo Git: PR → sandbox → main.
# Security updates do Dependabot miram o default branch (main) quando
# target-branch está setado — ver docs/guides/git-workflow.md.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    target-branch: sandbox
    labels:
      - dependencies
      - chore
    groups:
      cloudflare-types:
        patterns:
          - "@cloudflare/workers-types"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: sandbox
    labels:
      - dependencies
      - chore
